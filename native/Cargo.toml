[package]
name = "mps-manager-native"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
description = "Persistent script queues, NVIDIA MPS lifecycle, and an attachable terminal browser"
license = "MIT"

[dependencies]
scientific-workflow = { git = "https://github.com/wtrhacker/Scientific-Workflow", rev = "a426683b44e3106374f159ecd15d4ca666642cfd", features = ["external-tools"] }
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[workspace]
